<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CHAMOI</title>
    <link rel="stylesheet" th:href="@{/css/chamoi.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-badge">🌾 CHAMOI 🐟</span>
                <h1>Iniciar Sesión</h1>
                <p>Plataforma de análisis agrícola y pesquero para el Perú</p>
            </div>

            <!-- Alertas informativas, de éxito o de error -->
            <div th:if="${errorMsg != null or param.error != null}" class="alert alert-danger" role="alert">
                <span>⚠️</span>
                <span th:text="${errorMsg != null ? errorMsg : 'Correo o contraseña incorrectos.'}">Error</span>
            </div>

            <div th:if="${logoutMsg != null or param.logout != null}" class="alert alert-info" role="alert">
                <span>ℹ️</span>
                <span th:text="${logoutMsg != null ? logoutMsg : 'Has cerrado sesión correctamente.'}">Logout</span>
            </div>

            <div th:if="${successMsg != null}" class="alert alert-success" role="alert">
                <span th:text="${successMsg}">Éxito</span>
            </div>

            <!-- Formulario de Autenticación de Spring Security -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Correo Electrónico</label>
                    <input type="email" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="ejemplo@chamoi.pe" 
                           required 
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="••••••••" 
                           required>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>

            <div class="auth-footer">
                <p>¿Aún no tienes una cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
    <footer>
        &copy; CHAMOI - Análisis Agrícola y Pesquero del Perú
    </footer>
</body>
</html>
