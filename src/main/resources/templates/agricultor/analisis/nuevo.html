<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Nuevo Análisis Agrícola', 'analisis-nuevo', ~{::content})}">
<body>
    <div th:fragment="content">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Solicitar Análisis Agrícola</h1>
            <p style="color: var(--text-muted); margin-top: 0.25rem;">
                Ingresa la información de tu parcela y formula tu consulta para que el motor de reglas evalúe riesgos y recomendaciones.
            </p>
        </div>

        <div class="form-card">
            <form th:action="@{/agricultor/analisis}" th:object="${analisisRequest}" method="post">
                <div class="form-grid">
                    <!-- Selector de Cultivo -->
                    <div class="form-group">
                        <label for="cultivoId">Cultivo Principal</label>
                        <select id="cultivoId" th:field="*{cultivoId}" class="form-control">
                            <option value="">-- Selecciona un cultivo --</option>
                            <option th:each="c : ${cultivos}" th:value="${c.id}" th:text="${c.nombre}"></option>
                        </select>
                    </div>

                    <!-- Etapa del Cultivo -->
                    <div class="form-group">
                        <label for="etapaCultivo">Etapa Fenológica del Cultivo</label>
                        <input type="text" id="etapaCultivo" th:field="*{etapaCultivo}" class="form-control"
                               placeholder="Ej. Siembra, Crecimiento vegetativo, Floración, Maduración">
                    </div>

                    <!-- Área Cultivada -->
                    <div class="form-group">
                        <label for="areaCultivada">Área Cultivada</label>
                        <input type="number" step="0.01" id="areaCultivada" th:field="*{areaCultivada}" class="form-control"
                               placeholder="Ej. 3.5">
                    </div>

                    <!-- Unidad de Área -->
                    <div class="form-group">
                        <label for="unidadArea">Unidad de Medida</label>
                        <select id="unidadArea" th:field="*{unidadArea}" class="form-control">
                            <option value="ha">Hectáreas (ha)</option>
                            <option value="m2">Metros cuadrados (m²)</option>
                            <option value="topos">Topos</option>
                        </select>
                    </div>

                    <!-- Tipo de Suelo -->
                    <div class="form-group">
                        <label for="tipoSuelo">Tipo de Suelo / Textura</label>
                        <input type="text" id="tipoSuelo" th:field="*{tipoSuelo}" class="form-control"
                               placeholder="Ej. Franco, Franco-arenoso, Arcilloso">
                    </div>

                    <!-- Disponibilidad de Agua -->
                    <div class="form-group">
                        <label for="disponibilidadAgua">Disponibilidad de Agua</label>
                        <select id="disponibilidadAgua" th:field="*{disponibilidadAgua}" class="form-control">
                            <option value="Suficiente">Suficiente / Normal</option>
                            <option value="Escasa">Escasa / Estrés hídrico</option>
                            <option value="Abundante">Abundante / Exceso de lluvia</option>
                        </select>
                    </div>

                    <!-- Problema Principal -->
                    <div class="form-group full-width">
                        <label for="problemaPrincipal">Problema Principal Detectado (Opcional)</label>
                        <textarea id="problemaPrincipal" th:field="*{problemaPrincipal}" class="form-control"
                                  placeholder="Describe si observas amarillamiento foliar, marchitez, presencia de plagas o bajas temperaturas..."></textarea>
                    </div>

                    <!-- Pregunta para CHAMOI (Requerido) -->
                    <div class="form-group full-width">
                        <label for="pregunta">Pregunta o Consulta para CHAMOI *</label>
                        <textarea id="pregunta" th:field="*{pregunta}" class="form-control" rows="3"
                                  th:classappend="${#fields.hasErrors('pregunta')} ? 'is-invalid' : ''"
                                  placeholder="Ej. ¿Qué medidas preventivas debo tomar si baja la temperatura en los próximos días durante la floración?"></textarea>
                        <div class="field-error" th:if="${#fields.hasErrors('pregunta')}" th:errors="*{pregunta}"></div>
                    </div>

                    <!-- Observaciones Adicionales -->
                    <div class="form-group full-width">
                        <label for="observaciones">Observaciones Adicionales</label>
                        <input type="text" id="observaciones" th:field="*{observaciones}" class="form-control"
                               placeholder="Ej. Parcela cerca a ladera de río, uso reciente de fertilizante foliar...">
                    </div>
                </div>

                <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <a th:href="@{/agricultor/inicio}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <span>🚀</span>
                        <span>Solicitar Análisis</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
